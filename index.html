<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You 💌</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fcecff, #ffe9f3);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #6b4055;
    }

    .sparkle {
      position: fixed;
      color: white;
      font-size: 20px;
      animation: float 4s infinite ease-in-out;
      opacity: 0.8;
    }

    .s1 { top: 10%; left: 15%; }
    .s2 { top: 20%; right: 15%; animation-delay: 1s; }
    .s3 { bottom: 15%; left: 20%; animation-delay: 2s; }
    .s4 { bottom: 20%; right: 20%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.88);
      padding: 35px 28px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(150, 70, 110, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }

    .heart {
      font-size: 55px;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      margin: 10px 0;
      font-size: 30px;
      color: #d85b91;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      height: 130px;
      margin-top: 15px;
      padding: 15px;
      border: 2px solid #f3b6cf;
      border-radius: 18px;
      resize: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      color: #6b4055;
      background: #fff8fb;
    }

    textarea:focus {
      border-color: #d85b91;
    }

    button {
      margin-top: 18px;
      padding: 13px 28px;
      border: none;
      border-radius: 25px;
      background: #e978a7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(216, 91, 145, 0.25);
    }

    button:hover {
      transform: translateY(-2px);
      background: #d85b91;
    }

    #message {
      margin-top: 20px;
      display: none;
      padding: 15px;
      border-radius: 18px;
      background: #fff0f6;
      color: #b44b79;
    }
  </style>
</head>

<body>

  <div class="sparkle s1">✦</div>
  <div class="sparkle s2">✧</div>
  <div class="sparkle s3">✦</div>
  <div class="sparkle s4">♡</div>

  <div class="card">

    <div class="heart">💌</div>

    <h1>A Little Note For You</h1>

    <p>
      Sometimes the smallest words can mean the most.  
      Write something here that you want to keep safe. ♡
    </p>

    <textarea id="note" placeholder="Write your little secret here..."></textarea>

    <button onclick="sealNote()">🔒 Seal My Note</button>

    <div id="message">
      ✨ Your note has been sealed with love. 💗
    </div>

  </div>

  <script>
    function sealNote() {
      const note = document.getElementById("note").value.trim();
      const message = document.getElementById("message");

      if (note === "") {
        alert("Write something first! 💕");
        return;
      }

      localStorage.setItem("sealedNote", note);

      message.style.display = "block";
      message.innerHTML = "🔒✨ Your note has been sealed with love. 💗";
    }
  </script>

</body>
</html>
